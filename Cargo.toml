[package]
name = "manga-type"
version = "0.1.0"
edition = "2024"

[dependencies]
adb_client = { version = "4.0.0", default-features = false, features = ["usb"] }
eframe = "0.37.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "rayon"] }
md5 = "0.8.1"
natord = "1.0.9"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
env_logger = "0.11.12"

# Image code is generic, so it compiles into this crate too; unoptimized it is ~10x slower.
[profile.dev]
opt-level = 1

# Optimize dependencies fully even in dev builds.
[profile.dev.package."*"]
opt-level = 3
